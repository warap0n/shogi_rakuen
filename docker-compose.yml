version: '3.8'

services:
  shogi-api:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - .:/app
    environment:
      - GIN_MODE=debug
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - ./docker/postgres/init.d:/docker-entrypoint-initdb.d
      - ./docker/postgres/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: shogi-rakuen
      POSTGRES_PASSWORD: shogi-rakuen1116
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
      POSTGRES_DB: shogi
    hostname: postgres
    restart: always
    user: root

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 81:80
    environment:
      PGADMIN_DEFAULT_EMAIL: shogiRakuen@example.com
      PGADMIN_DEFAULT_PASSWORD: shogiRakuenPass
    volumes:
      - ./docker/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
